<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        :root {
            --highlight-orange: #FF7F50;
            --text-primary: #333;
            --bg-primary: #fff;
            --sidebar-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar-trigger {
            position: fixed;
            left: 0;
            top: 0;
            width: 180px;
            height: 100vh;
            z-index: 10;  /* Changed from 100 to 98 */
        }

        .sidebar {
            position: fixed;
            left: -280px;
            width: 280px;
            height: 100vh;
            background: var(--sidebar-bg);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 1rem;
            z-index: 97;  /* Changed from 99 to 97 */
        }

        .sidebar-trigger:hover + .sidebar,
        .sidebar:hover {
            transform: translateX(270px);
        }

        .sidebar.active {
            transform: translateX(270px);
        }

        .main-content {
            padding: 2rem;
            flex-grow: 1;
        }

        @media screen and (min-width: 768px) {
            .main-content {
            margin-left: 280px;
            }
        }

        .greeting {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--text-primary);
        }

        .highlight {
            color: var(--highlight-orange);
            display: inline-block;
            margin-right: 0.5rem;
            position: relative;
            top: 10px;
        }

        .menu-item {
            padding: 0.75rem 1rem;
            margin: 0.5rem 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .menu-item:hover {
            background-color: rgba(255, 127, 80, 0.1);
        }

        .user-profile {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
            display: flex;
            align-items: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: box-shadow 0.3s ease;
            cursor: pointer;
        }

        .user-profile:hover {
            box-shadow: 0 2px 15px rgba(255, 127, 80, 0.3);
        }

        .profile-image {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 1rem;
            object-fit: cover;
        }

        .user-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .user-email {
            font-size: 0.875rem;
            color: #666;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }

        .logout-button {
            position: absolute;
            bottom: 20px;
            left: 1rem;
            right: 1rem;
            background: lightcoral;
            padding: 0.75rem;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transform: translateY(0);
            opacity: 0;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text-primary);
            z-index: 90;  /* Added this line to make it appear on top */
            pointer-events: none; /* Initially disabled */
        }

        .logout-button:hover {
                background-color: rgba(255, 0, 0, 0.7);
            }

        /* When visible, enable pointer events */
        .logout-button.show-logout {
            transform: translateY(-60px) !important;
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        .recent-items {
            margin-top: 2rem;
        }

        .recent-items h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }

        .recent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }

        .recent-item {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
        }

        .recent-item:hover {
            transform: translateY(-2px);
        }

        /* Add this new class for mobile devices */
        .show-logout {
            transform: translateY(-60px) !important;
            opacity: 1 !important;
        }

        /* Only apply hover effects on devices that support hover */
        @media (hover: hover) {
            .user-profile:hover + .logout-button,
            .logout-button:hover {
                transform: translateY(-60px);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar-trigger"></div>
        <nav class="sidebar">
            <div class="menu-items">
                <div class="menu-item">Home</div>
                <div class="menu-item">Starred</div>
                <div class="menu-item">Recents</div>
            </div>
            <div class="user-profile">
                <img src="{{ user.picture }}" alt="Profile" class="profile-image">
                <div class="user-info">
                    <div class="user-email">{{ user.email }}</div>
                </div>
            </div>
            <a href="/logout" class="logout-button">Logout</a>
        </nav>
        <main class="main-content">
            <h1 class="greeting">
                <img src="{{ url_for('static', filename='images/logo.png') }}" class="highlight" style="width: 50px; height: 50px;">
                Hello, {{ user.name }}!
            </h1>
            <div class="recent-items">
                <h2>Lorem Ipsum</h2>
                <div class="recent-grid">
                    <div class="recent-item">Project Discussion</div>
                    <div class="recent-item">Code Review</div>
                    <div class="recent-item">Meeting Notes</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Add touch support for mobile devices
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.querySelector('.sidebar');
            let touchStartX = 0;
            let touchEndX = 0;

            document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            console.log('Touch start:', touchStartX); // Debug statement
            });

            document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            console.log('Touch end:', touchEndX); // Debug statement
            console.log('Swipe distance:', touchEndX - touchStartX); // Debug statement
            
            if (touchEndX - touchStartX > 50) { // Right swipe
                console.log('Right swipe detected'); // Debug statement
                sidebar.classList.add('active');
            } else if (touchStartX - touchEndX > 50) { // Left swipe
                console.log('Left swipe detected'); // Debug statement 
                sidebar.classList.remove('active');
            }
            });

            // Add this new code for mobile logout
            const userProfile = document.querySelector('.user-profile');
            const logoutButton = document.querySelector('.logout-button');
            
            userProfile.addEventListener('click', (e) => {
                e.stopPropagation();  // Prevent the document click from firing
                logoutButton.classList.toggle('show-logout');
            });

            // Hide logout when clicking anywhere else
            document.addEventListener('click', () => {
                logoutButton.classList.remove('show-logout');
            });
            
            logoutButton.addEventListener('click', (e) => {
                e.stopPropagation();  // Let the link work normally
            });

            // Event listener for transition end
            logoutButton.addEventListener('transitionend', function() {
                if (this.style.opacity === '0') {
                    this.style.pointerEvents = 'none';
                } else {
                    this.style.pointerEvents = 'auto';
                }
            });
        });
    </script>
</body>
</html>
