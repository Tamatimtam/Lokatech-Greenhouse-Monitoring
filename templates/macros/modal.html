{% macro modal(id, title, saveButtonText="Save Changes", cancelButtonText="Cancel") %}
<div class="modal" id="{{ id }}">
  <div class="modal__content">
    <div class="modal__header">
      <h3 class="modal__title">{{ title }}</h3>
      <button class="modal__close" id="close{{ id }}">&times;</button>
    </div>
    <div class="modal__body">
      {{ caller() }}
    </div>
    <div class="modal__footer">
      <button class="modal__button modal__button--secondary" id="cancel{{ id }}">{{ cancelButtonText }}</button>
      <button class="modal__button modal__button--primary" id="save{{ id }}">{{ saveButtonText }}</button>
    </div>
  </div>
</div>
{% endmacro %}
