[env:gateway_node]
platform = espressif32
board = denky32
framework = arduino
upload_speed = 921600
board_build.flash_mode = qio
board_build.f_flash = 80000000L
monitor_speed = 115200
; Updated filter: Exclude everything in src first, then include only GatewayNode.cpp
; LDF should find the common library files based on includes in GatewayNode.cpp
build_src_filter = -<*> +<GatewayNode.cpp>
lib_deps =
    # WiFi/ESP-NOW included in framework
    bblanchon/ArduinoJson @ ^6.20.0 ; Needed to send JSON via Serial

[env:hx711_reader]
platform = espressif32
board = denky32
framework = arduino
upload_speed = 921600
board_build.flash_mode = qio
board_build.f_flash = 80000000L
monitor_speed = 115200
build_src_filter = -<*> +<HX711_Reader.cpp>
lib_deps =
    bogde/HX711 @ ^0.7.5
